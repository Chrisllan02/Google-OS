<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google OS</title>
    <meta name="description" content="Painel unificado inspirado no Google Workspace, com Drive, Gmail, Agenda e Gemini AI." />
    <meta property="og:title" content="Google OS" />
    <meta property="og:description" content="Painel unificado inspirado no Google Workspace, com Drive, Gmail, Agenda e Gemini AI." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=container-queries"></script>
    <style>
      html { font-size: 90%; }
      body { font-family: 'Google Sans', 'Poppins', sans-serif; }
      .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #bdc1c6; }
      .animate-in { animation-duration: 300ms; animation-fill-mode: both; animation-timing-function: cubic-bezier(0.2, 0, 0.2, 1); }
      .zoom-in { animation-name: zoomIn; }
      .fade-in { animation-name: fadeIn; }
      .slide-in-from-right-10 { animation-name: slideInRight; }
      .slide-in-from-bottom-4 { animation-name: slideInBottom; }
      @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideInRight { from { opacity: 0; transform: translateX(2.5rem); } to { opacity: 1; transform: translateX(0); } }
      @keyframes slideInBottom { from { opacity: 0; transform: translateY(1rem); } to { opacity: 1; transform: translateY(0); } }
      :root { --g-red: #EA4335; --g-blue: #4285F4; --g-green: #34A853; --g-yellow: #FBBC05; }
      .glass-btn { position: relative; width: 54px; height: 54px; border-radius: 50%; border: none; outline: none; background: transparent; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.2s ease; isolation: isolate; -webkit-tap-highlight-color: transparent; }
      .glass-btn:active { transform: scale(0.92); }
      .glass-btn::before { content: ''; position: absolute; inset: -3px; border-radius: 50%; padding: 3px; background: conic-gradient(from 180deg, transparent 0%, transparent 45%, var(--g-red), var(--g-yellow), var(--g-green), var(--g-blue)); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; z-index: -1; opacity: 0; filter: blur(2px); }
      .glass-btn::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(from 180deg, transparent 0%, transparent 45%, var(--g-red), var(--g-yellow), var(--g-green), var(--g-blue)); z-index: -2; opacity: 0; filter: blur(12px); }
      .glass-btn.active::before, .glass-btn.active::after { animation: spinSnake 0.8s cubic-bezier(0.25, 1, 0.5, 1) 1 forwards; }
      @keyframes spinSnake { 0% { transform: rotate(0deg); opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { transform: rotate(360deg); opacity: 0; } }
      /* Apple Glass (visionOS / macOS Dense Frosted Glass) Optical System */
      .glass-body {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background-color: rgba(22, 22, 28, 0.88);
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.03) 50%, rgba(255, 255, 255, 0.08) 100%);
        backdrop-filter: blur(64px) saturate(210%);
        -webkit-backdrop-filter: blur(64px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.20);
        box-shadow:
          inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.40),
          inset 1px 0 1px 0 rgba(255, 255, 255, 0.22),
          inset 0 -1px 1px 0 rgba(255, 255, 255, 0.10),
          0 0 0 0.5px rgba(0, 0, 0, 0.65),
          0 12px 32px -4px rgba(0, 0, 0, 0.56),
          0 4px 12px 0 rgba(0, 0, 0, 0.34);
        z-index: 1;
        transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .light-theme .glass-body {
        background-color: rgba(250, 251, 254, 0.90);
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.35) 50%, rgba(255, 255, 255, 0.60) 100%);
        backdrop-filter: blur(64px) saturate(210%) brightness(1.04);
        -webkit-backdrop-filter: blur(64px) saturate(210%) brightness(1.04);
        border: 1px solid rgba(255, 255, 255, 0.92);
        box-shadow:
          inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 1),
          inset 1px 0 1px 0 rgba(255, 255, 255, 0.90),
          inset 0 -1px 1.5px 0 rgba(255, 255, 255, 0.70),
          0 0 0 0.5px rgba(0, 0, 0, 0.08),
          0 12px 32px -4px rgba(15, 23, 42, 0.12),
          0 4px 12px 0 rgba(15, 23, 42, 0.06);
      }
      .glass-btn:hover .glass-body {
        background-color: rgba(32, 32, 40, 0.94);
        border-color: rgba(255, 255, 255, 0.30);
        box-shadow:
          inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.50),
          inset 1px 0 1px 0 rgba(255, 255, 255, 0.28),
          inset 0 -1px 1px 0 rgba(255, 255, 255, 0.14),
          0 0 0 0.5px rgba(0, 0, 0, 0.70),
          0 14px 36px -4px rgba(0, 0, 0, 0.62),
          0 4px 14px 0 rgba(0, 0, 0, 0.38);
      }
      .light-theme .glass-btn:hover .glass-body {
        background-color: rgba(255, 255, 255, 0.95);
        border-color: rgba(255, 255, 255, 1);
        box-shadow:
          inset 0 1.5px 2px 0 rgba(255, 255, 255, 1),
          inset 1px 0 1.5px 0 rgba(255, 255, 255, 0.95),
          inset 0 -1px 1.5px 0 rgba(255, 255, 255, 0.75),
          0 0 0 0.5px rgba(0, 0, 0, 0.09),
          0 14px 36px -4px rgba(15, 23, 42, 0.15),
          0 4px 14px 0 rgba(15, 23, 42, 0.07);
      }
      .glass-btn.active .glass-body {
        background-color: rgba(38, 38, 48, 0.96);
        border-color: rgba(255, 255, 255, 0.36);
      }
      .light-theme .glass-btn.active .glass-body {
        background-color: rgba(255, 255, 255, 0.97);
        border-color: rgba(255, 255, 255, 1);
      }

      /* Standardized Apple Glass Surfaces */
      .glass-surface {
        background-color: rgba(20, 20, 26, 0.86);
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.03) 52%, rgba(255, 255, 255, 0.07) 100%);
        backdrop-filter: blur(64px) saturate(210%);
        -webkit-backdrop-filter: blur(64px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow:
          inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.36),
          inset 1px 0 1px 0 rgba(255, 255, 255, 0.18),
          inset 0 -1px 1px 0 rgba(255, 255, 255, 0.09),
          0 0 0 0.5px rgba(0, 0, 0, 0.65),
          0 16px 40px -6px rgba(0, 0, 0, 0.54),
          0 4px 14px 0 rgba(0, 0, 0, 0.30);
      }
      .glass-surface:hover {
        background-color: rgba(24, 24, 32, 0.90);
        border-color: rgba(255, 255, 255, 0.26);
        box-shadow:
          inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.44),
          inset 1px 0 1px 0 rgba(255, 255, 255, 0.24),
          inset 0 -1px 1px 0 rgba(255, 255, 255, 0.12),
          0 0 0 0.5px rgba(0, 0, 0, 0.68),
          0 20px 44px -6px rgba(0, 0, 0, 0.58),
          0 6px 16px 0 rgba(0, 0, 0, 0.32);
      }
      .light-theme .glass-surface {
        background-color: rgba(250, 251, 254, 0.88);
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0.32) 52%, rgba(255, 255, 255, 0.56) 100%);
        backdrop-filter: blur(64px) saturate(210%) brightness(1.04);
        -webkit-backdrop-filter: blur(64px) saturate(210%) brightness(1.04);
        border: 1px solid rgba(255, 255, 255, 0.90);
        box-shadow:
          inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 1),
          inset 1px 0 1px 0 rgba(255, 255, 255, 0.88),
          inset 0 -1px 1.5px 0 rgba(255, 255, 255, 0.68),
          0 0 0 0.5px rgba(0, 0, 0, 0.08),
          0 16px 40px -6px rgba(15, 23, 42, 0.11),
          0 4px 14px 0 rgba(15, 23, 42, 0.05);
      }
      .light-theme .glass-surface:hover {
        background-color: rgba(253, 254, 255, 0.93);
        border-color: rgba(255, 255, 255, 0.98);
        box-shadow:
          inset 0 1.5px 2px 0 rgba(255, 255, 255, 1),
          inset 1px 0 1.5px 0 rgba(255, 255, 255, 0.92),
          inset 0 -1px 1.5px 0 rgba(255, 255, 255, 0.74),
          0 0 0 0.5px rgba(0, 0, 0, 0.09),
          0 20px 44px -6px rgba(15, 23, 42, 0.14),
          0 6px 16px 0 rgba(15, 23, 42, 0.06);
      }

      .glass-control {
        background-color: rgba(22, 22, 28, 0.88);
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.03) 52%, rgba(255, 255, 255, 0.08) 100%);
        backdrop-filter: blur(64px) saturate(210%);
        -webkit-backdrop-filter: blur(64px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.20);
        box-shadow:
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.38),
          inset 1px 0 1px 0 rgba(255, 255, 255, 0.20),
          inset 0 -1px 1px 0 rgba(255, 255, 255, 0.09),
          0 0 0 0.5px rgba(0, 0, 0, 0.62),
          0 6px 20px -2px rgba(0, 0, 0, 0.44),
          0 2px 6px 0 rgba(0, 0, 0, 0.26);
      }
      .glass-control:hover {
        background-color: rgba(34, 34, 42, 0.94);
        border-color: rgba(255, 255, 255, 0.30);
        box-shadow:
          inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.48),
          inset 1px 0 1px 0 rgba(255, 255, 255, 0.26),
          inset 0 -1px 1px 0 rgba(255, 255, 255, 0.12),
          0 0 0 0.5px rgba(0, 0, 0, 0.68),
          0 8px 24px -2px rgba(0, 0, 0, 0.50),
          0 3px 8px 0 rgba(0, 0, 0, 0.28);
      }
      .light-theme .glass-control {
        background-color: rgba(250, 251, 254, 0.90);
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.35) 52%, rgba(255, 255, 255, 0.60) 100%);
        backdrop-filter: blur(64px) saturate(210%) brightness(1.04);
        -webkit-backdrop-filter: blur(64px) saturate(210%) brightness(1.04);
        border: 1px solid rgba(255, 255, 255, 0.92);
        box-shadow:
          inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 1),
          inset 1px 0 1px 0 rgba(255, 255, 255, 0.88),
          inset 0 -1px 1px 0 rgba(255, 255, 255, 0.68),
          0 0 0 0.5px rgba(0, 0, 0, 0.08),
          0 6px 20px -2px rgba(15, 23, 42, 0.10),
          0 2px 6px 0 rgba(15, 23, 42, 0.05);
      }
      .light-theme .glass-control:hover {
        background-color: rgba(255, 255, 255, 0.96);
        border-color: rgba(255, 255, 255, 1);
        box-shadow:
          inset 0 1.5px 2px 0 rgba(255, 255, 255, 1),
          inset 1px 0 1.5px 0 rgba(255, 255, 255, 0.94),
          inset 0 -1px 1.5px 0 rgba(255, 255, 255, 0.75),
          0 0 0 0.5px rgba(0, 0, 0, 0.09),
          0 8px 24px -2px rgba(15, 23, 42, 0.14),
          0 3px 8px 0 rgba(15, 23, 42, 0.06);
      }

      .glass-popover {
        background-color: rgba(20, 20, 26, 0.93);
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.04) 50%, rgba(255, 255, 255, 0.09) 100%);
        backdrop-filter: blur(72px) saturate(215%);
        -webkit-backdrop-filter: blur(72px) saturate(215%);
        border: 1px solid rgba(255, 255, 255, 0.20);
        box-shadow:
          inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.40),
          inset 1px 0 1px 0 rgba(255, 255, 255, 0.22),
          inset 0 -1px 1px 0 rgba(255, 255, 255, 0.10),
          0 0 0 0.5px rgba(0, 0, 0, 0.72),
          0 24px 60px -8px rgba(0, 0, 0, 0.65),
          0 8px 20px 0 rgba(0, 0, 0, 0.36);
      }
      .light-theme .glass-popover {
        background-color: rgba(252, 253, 255, 0.94);
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.88) 0%, rgba(255, 255, 255, 0.42) 50%, rgba(255, 255, 255, 0.65) 100%);
        backdrop-filter: blur(72px) saturate(215%) brightness(1.04);
        -webkit-backdrop-filter: blur(72px) saturate(215%) brightness(1.04);
        border: 1px solid rgba(255, 255, 255, 0.94);
        box-shadow:
          inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 1),
          inset 1px 0 1px 0 rgba(255, 255, 255, 0.90),
          inset 0 -1px 1.5px 0 rgba(255, 255, 255, 0.72),
          0 0 0 0.5px rgba(0, 0, 0, 0.09),
          0 24px 60px -8px rgba(15, 23, 42, 0.18),
          0 8px 20px 0 rgba(15, 23, 42, 0.08);
      }

      .glass-item {
        background-color: rgba(255, 255, 255, 0.08);
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.02) 60%, rgba(255, 255, 255, 0.06) 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          inset 0 1px 0.5px 0 rgba(255, 255, 255, 0.22),
          inset 0 -0.5px 0.5px 0 rgba(255, 255, 255, 0.06);
      }
      .glass-item:hover {
        background-color: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.20);
        box-shadow:
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.30),
          inset 0 -0.5px 0.5px 0 rgba(255, 255, 255, 0.10),
          0 4px 12px -2px rgba(0, 0, 0, 0.26);
      }
      .light-theme .glass-item {
        background-color: rgba(255, 255, 255, 0.78);
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.28) 60%, rgba(255, 255, 255, 0.48) 100%);
        border: 1px solid rgba(255, 255, 255, 0.88);
        box-shadow:
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.98),
          inset 0 -0.5px 0.5px 0 rgba(255, 255, 255, 0.62),
          0 0 0 0.5px rgba(0, 0, 0, 0.05),
          0 2px 6px -1px rgba(15, 23, 42, 0.05);
      }
      .light-theme .glass-item:hover {
        background-color: rgba(255, 255, 255, 0.92);
        border-color: rgba(255, 255, 255, 0.98);
        box-shadow:
          inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 1),
          inset 0 -1px 1px 0 rgba(255, 255, 255, 0.72),
          0 0 0 0.5px rgba(0, 0, 0, 0.06),
          0 4px 12px -2px rgba(15, 23, 42, 0.08);
      }

      .home-icon { position: relative; z-index: 2; color: rgba(255, 255, 255, 0.75); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      .light-theme .home-icon { color: #3c4043; }
      .glass-btn.active .home-icon { color: #ffffff; filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8)); transform: scale(1.1); }
      .light-theme .glass-btn.active .home-icon { color: #1a73e8; filter: drop-shadow(0 0 8px rgba(26, 115, 232, 0.35)); }
      .mask-linear-fade { -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent); }
      .glass-icon-svg { filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.35)); transition: filter 0.3s cubic-bezier(0.22, 1, 0.36, 1), transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); transform-origin: center center; }
      .light-theme .glass-icon-svg { filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.12)); }
      .group:hover .glass-icon-svg { filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.55)) drop-shadow(0 2px 8px rgba(0, 0, 0, 0.35)); }
      .light-theme .group:hover .glass-icon-svg { filter: drop-shadow(0 3px 8px rgba(66, 133, 244, 0.28)); }
      .group:hover .glass-icon-svg .glass-paths path,
      .group:hover .glass-icon-svg .glass-paths polygon,
      .group:hover .glass-icon-svg .glass-paths rect,
      .group:hover .glass-icon-svg .glass-paths circle { stroke: rgba(255, 255, 255, 0.95); filter: brightness(1.15); }
      .glass-icon-svg.active { filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.8)); }
      .light-theme .glass-icon-svg.active { filter: drop-shadow(0 2px 8px rgba(66, 133, 244, 0.40)); }
      .mask-aurora-bottom {
        -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
        mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
      }
      .theme-transitioning,
      .theme-transitioning *,
      .theme-transitioning *::before,
      .theme-transitioning *::after {
        transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform !important;
        transition-duration: 480ms !important;
        transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
